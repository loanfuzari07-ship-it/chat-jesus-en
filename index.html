         ever uses fonts already installed on the device (macOS/iOS get San

         "Segoe UI" isn't an actual Google Fonts family — Microsoft doesn't
         license it for open distribution — so that request used to return
         nothing useful while still blocking the first render on every visit.
         Removing it is a pure win: same fonts shown, one less blocking
         request on the very first (and highest-dropoff) page load. -->
